# ML Training Config - Flow Matching Multi-Target v9.4
# South Asia 55E-100E, 0N-40N 1-degree PR target plus GEOS-residual T2M target.
# Local SA land/MJO predictors feed the target grid; full-global
# ocean/circulation/moisture predictors feed spatial global cross-attention.
batch_size: 4
# Fine-tuning begins from the independently selected v9.3 model. Use a fresh,
# lower-LR optimizer; never import the v9.3 epoch, optimizer, or scheduler.
learning_rate: 5e-6
weight_decay: 1e-4
reset_optimizer_state: False
finetune_init_checkpoint: ml_output_flowmulti_v9_3_sa_55e100e_0n40n_noisectx_t2mres/best_flow_ckpt.pt
finetune_require_init: True
training_seed: 1234
validation_seed: 4321
# Fixed RNG streams are enabled; leave strict deterministic CUDA kernels off
# to preserve the original v9.4 numerical/performance path.
deterministic_training: False
epochs: 20
output_dir: ml_output_flowmulti_v9_4_sa_55e100e_0n40n_noisectx_t2mres
mixed_precision: bf16
num_workers: 1
data_dir: /scratch/11353/afahad/geossub/dataprocess
train_start_year: 1999
train_end_year: 2020
val_start_year: 2021
val_end_year: 2023
preload: True
save_top_k: 4
stats_file: v8_sa_55e100e_0n40n_global_local_stats.pt
unet_block_out_channels: [128, 256, 512, 768]
target_domain: south_asia
target_domain_bounds:
  label: South Asia 55E-100E 0N-40N
  lat_min: 0.0
  lat_max: 40.0
  lon_min: 55.0
  lon_max: 100.0
t2m_target_mode: geos_residual
lead_selective_geos: True
lead_loss_weights: [1.0, 1.2, 1.5, 2.0]

# v9.4 static geography. Elevation comes from the NASA GLDAS 0.25-degree
# GTOPO30-derived field; land and coordinate channels are generated locally.
static_geography_file: ml_model/static_geography_multiv9_4_sa.pt
elevation_file: /home1/11353/afahad/geos_subc/ml_model/GLDASp5_elevation_025d.nc4
elevation_variable: GLDAS_elevation
require_elevation_file: True
elevation_normalization: minmax
# Reuse the exact v9.2/v9.3 loss-weighting land mask as a model input.
static_land_mask_file: ml_model/land_ocean_mask_v6_south_asia_55e_100e_0n_40n.pt
cache_static_geography: True
rebuild_static_geography: False
plot_static_geography: True
plot_topography: True

# v9.4 spatial global tokens and bottleneck cross-attention. Set False for the
# pooled-vector-only ablation while retaining the same global encoder.
use_global_cross_attention: True
global_attention_heads: 4
global_attention_layers: 1

# v9.4 auxiliary velocity objectives.
gradient_loss_weight_pr: 0.03
gradient_loss_weight_t2m: 0.01
multiscale_loss_weight_2x_pr: 0.03
multiscale_loss_weight_2x_t2m: 0.01
multiscale_loss_weight_4x_pr: 0.02
multiscale_loss_weight_4x_t2m: 0.01

# Local predictors are cropped to the v9 55E-100E, 0N-40N target grid.
local_obs_variables:
  - sm
  - mjo

# Global predictors keep the full 181x360 grid and feed the FiLM context.
global_context_variables:
  - sst
  - sss
  - ivt
  - z500_zonal_dev
  - u250

# v9.4 starts from the mature v9.3 noise settings.
train_noise_mode: eof_lhs_mix
train_rho_pr: 0.25
train_rho_t2m: 0.08
train_rho_after_epoch: 0
train_rho_pr_after: 0.25
train_rho_t2m_after: 0.08
train_time_schedule: stratified_low_mid
train_time_beta_alpha: 1.5
train_time_beta_beta: 2.0
train_time_low_fraction: 0.35
train_time_mid_fraction: 0.50

# v9.4: mild group dropout to reduce over-reliance on slow boundary context.
# GEOS is kept on by default because it is the operational forecast baseline.
context_dropout_prob: 0.10
drop_local_obs_prob: 0.05
drop_global_context_prob: 0.10
drop_geos_prob: 0.00

reset_validation_history: False
# Set True to enter variance-head-only training immediately at the next launch,
# regardless of the current epoch. On the first forced launch, load
# variance_phase_best_checkpoint; chained launches then resume the variance
# state from latest_flow_ckpt.pt instead of restarting it.
var_forced: False
# v9.4 fine-tunes the complete model and preserves variance skill jointly.
variance_phase_lr: 1e-5
variance_phase_start_epoch: 0
variance_phase_start_from_best: False
variance_phase_best_checkpoint: best_flow_ckpt.pt
variance_training_num_ensemble: 15
joint_variance_start_epoch: 1
joint_variance_loss_weight: 0.03
validation_num_ensemble: 15
validation_num_steps: 10
validation_ode_batch_size: 120
# A pre-trained model is being fine-tuned, so validate every v9.4 epoch.
crps_validation_start_epoch: 1
crps_validation_milestones: [1]
crps_validation_every_after_epoch: 1
crps_plot_on_validation: True
crps_selection_start_epoch: 1
mse_validation_seed: 1234
crps_val_start_year: 2021
crps_val_end_year: 2021
validation_variance_coarse_kernel: 8
validation_rho_pr: 0.25
validation_rho_t2m: 0.08
validation_var_beta_pr: 0.45
validation_var_beta_t2m: 0.03
dense_mse_validation_until: 0
plot_validation_every: 0
mse_plateau_patience: 3
mse_plateau_factor: 0.5
mse_min_lr: 1e-6
mse_early_stop_patience: 0
mse_early_stop_start_epoch: 15
mse_early_stop_min_delta: 0.0003

# v9.4 extreme-balanced fine-tuning. All thresholds and labels are calculated
# from 1999-2020 only and saved as a reusable artifact.
extreme_balanced_sampling: True
extreme_sampling_artifact: ml_model/extreme_sampling_multiv9_4_sa.pt
rebuild_extreme_sampling_artifact: False
extreme_sampling_fractions: [0.65, 0.15, 0.10, 0.10]
extreme_uniform_fraction: 0.0
extreme_sampling_correction_min: 0.25
extreme_sampling_correction_max: 4.0
extreme_sampling_seed: 941

# Decode a one-step endpoint estimate into physical units and emphasize the
# observed PR/T2M tails. Losses ramp in over five epochs.
physical_tail_loss_weight: 0.03
neighborhood_extreme_loss_weight: 0.01
extreme_loss_start_epoch: 1
extreme_loss_ramp_epochs: 5
extreme_tail_cap: 4.0
extreme_neighborhood_temperature_pr: 1.0
extreme_neighborhood_scales: [3, 5]

# Keep natural CRPS validation and add a fixed, training-threshold-defined
# extreme subset from the validation years. The selection score combines
# model/GEOS CRPS ratios so the two views are on comparable scales.
extreme_validation: True
extreme_validation_max_per_category: 8
extreme_validation_seed: 1941
extreme_validation_selection_weight: 0.50

crps_loss: False
crps_loss_num_ensemble: 2
crps_loss_num_steps: 10
crps_loss_ode_batch_size: 2
crps_loss_max_ensemble_per_chunk: 1
crps_loss_pr_weight: 1.0
crps_loss_t2m_weight: 1.0
crps_loss_use_land_ocean_weights: False
crps_loss_use_gradient_checkpointing: True

test_num_ensemble: 100
test_num_steps: 50
test_max_ensemble_per_chunk: 30
test_sample_plot_limit: 0
