# ML Training Config - Flow Matching Multi-Target (PR + T2M)
# Multi-v1 architecture: 49 input channels, 2 output channels per lead head
batch_size: 4
learning_rate: 5e-5
epochs: 300
output_dir: ml_output_flowmulti
mixed_precision: fp16
num_workers: 1
data_dir: /home1/11353/afahad/geos_subc/dataprocess
train_start_year: 1999
train_end_year: 2019
val_start_year: 2020
val_end_year: 2021
preload: True
save_top_k: 4
stats_file: v1_multi_global_stats.pt

reset_validation_history: True
force_variance_phase: True
variance_phase_lr: 1e-5
variance_phase_unfreeze_mode: conv_in
variance_phase_train_mean_heads: False
variance_phase_velocity_loss_weight: 0.7
variance_phase_variance_loss_weight: 0.3
pr_regime_residual_scale: 0.35
t2m_regime_residual_scale: 0.35
pr_variance_loss_weight: 1.00
t2m_variance_loss_weight: 1.00
validation_use_eof_noise: True
validation_apply_variance_pr: True
validation_apply_variance_t2m: True
validation_match_inference: True
validation_num_ensemble: 15
validation_num_steps: 10
